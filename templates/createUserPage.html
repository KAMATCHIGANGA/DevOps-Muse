<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcourt | Create User</title>
  <link rel="stylesheet" href="../static/createUserPage.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="{{ url_for('homePage') }}">
        <span class="brand-star">★</span>
        <span>Starcourt</span>
      </a>
    </nav>
  </header>

  <main class="create-user-page">
    <div class="create-user-card">
      <div class="create-user-header">
        <p class="eyebrow">WELCOME TO STARCOURT</p>
        <h3>Create your account </h3>
        
      </div>

      <form action="/createUser" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        

        <div class="form-group">
          <label for="security-question">Hint Question</label>
          <input type="text" id="security-question" name="security_question" value="What's your favourite animal?" readonly>
        </div>

        <div class="form-group">
          <label for="security-answer">Your Answer</label>
          <input type="text" id="security-answer" name="security_answer" placeholder="Enter your answer" required>
        </div>

        <button type="submit" class="primary-button">Create User</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <span>★ Starcourt</span>
    <span>Fresh choices, simply delivered.</span>
  </footer>
</body>
</html>
