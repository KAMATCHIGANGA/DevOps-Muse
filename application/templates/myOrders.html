<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="stylesheet" href="../static/myOrders.css">
</head>

<body>

    <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="{{ url_for('loggedIn') }}">
        <span class="brand-star">★</span>
        <span>Starcourt</span>
      </a>

      <div class="nav-links">
        <div class="dropdown">
          <button class="nav-button dropdown-button" type="button">
            Products <span class="chevron">⌄</span>
          </button>
          <div class="dropdown-menu">
            <a href="#fruits">Fruits</a>
            <a href="#vegetables">Vegetables</a>
          </div>
        </div>

        <a class="nav-button" href="{{url_for('myOrders')}}">My Orders</a>

        <span class="nav-button user-greeting">Hi, {{ username[:3] }}</span>

        <a class="cart-button" href="{{url_for('cart')}}">
          <span class="cart-icon">🛒</span>
          Cart
        </a>
      </div>
    </nav>
  </header>

    <main class="orders-container">

        <h1>My Orders</h1>

        {% if orders %}

            <div class="orders-list">

                {% for order in orders %}
                <div class="order-card">
                    <div>
                        <span>Order Number</span>
                        <h2>{{ order.order_number }}</h2>
                    </div>

                    <div class="order-status">
                        <span>Order Total</span>
                        <strong>₹{{ order.total_price }}</strong>
                    </div>
                </div>
                {% endfor %}

            </div>

        {% else %}

            <div class="empty-orders">
                <p>You haven't placed any orders yet.</p>
                <a href="{{ url_for('loggedIn') }}">Start Shopping</a>
            </div>

        {% endif %}

    </main>

</body>
</html>
