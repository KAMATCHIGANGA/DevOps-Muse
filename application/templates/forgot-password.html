<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcourt | Forgot Password</title>
  <link rel="stylesheet" href="../static/forgot-password.css">
</head>

<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="/">
        <span class="brand-star">★</span>
        <span>Starcourt</span>
      </a>
    </nav>
  </header>

  <main class="forgot-password-page">
    <section class="forgot-password-card">
      <div class="forgot-password-heading">
        <h2 class="eyebrow">ACCOUNT RECOVERY</h2>
        <p>Enter your username and answer your hint question to continue.</p>
      </div>

      <form action="/passwordRecovery" method="post" class="forgot-password-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label>Hint Question</label>
          <div class="hint-question">What's your favourite animal?</div>
        </div>

        <div class="form-group">
          <label for="security-answer">Hint Answer</label>
          <input
            type="text"
            id="security-answer"
            name="security_answer"
            placeholder="Enter your answer"
            required
          >
        </div>
        <button type="submit" class="primary-button">Continue</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <span>★ Starcourt</span>
    <span>Fresh choices, simply delivered.</span>
  </footer>
</body>

</html>
