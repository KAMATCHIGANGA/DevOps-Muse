<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcourt | Password Recovery</title>
  <link rel="stylesheet" href="../static/passwordRecovery.css">
</head>

<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="/">
        <span class="brand-star">★</span>
        <span>Starcourt</span>
      </a>
    </nav>
  </header>

  <main class="recovery-page">
    <section class="recovery-card">

      {% if is_valid %}

        <div class="recovery-heading">
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h1>Set New Password</h1>
          <p>Choose a new password for your Starcourt account.</p>
        </div>

        <form class="recovery-form" method="post">
          <input type="hidden" name="username" value="{{ username }}">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input
              type="password"
              id="new-password"
              name="new_password"
              placeholder="Enter your new password"
              required
            >
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              placeholder="Re-enter your new password"
              required
            >
          </div>

          <button type="submit" class="primary-button">Reset Password</button>
        </form>

      {% else %}

        <div class="recovery-heading">
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h1>Verification Failed</h1>
          <p class="error-message">Username or hint answer is incorrect.</p>
        </div>

        <a href="{{ url_for('forgotPassword') }}" class="secondary-button">
          Try Again
        </a>

      {% endif %}

    </section>
  </main>

  <footer class="footer">
    <span>★ Starcourt</span>
    <span>Fresh choices, simply delivered.</span>
  </footer>
</body>

</html>
