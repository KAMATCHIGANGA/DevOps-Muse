<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starcourt | Sign In</title>
  <link rel="stylesheet" href="../static/loginPage.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="{{ url_for('homePage') }}">
        <span class="brand-star">★</span>
        <span>Starcourt</span>
      </a>
    </nav>
  </header>
  <div class="flash-message">
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <div class="success-message">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}
</div>
  <!-- Login -->
  <main class="login-page">
    <section class="login-card">
      
      <div class="login-heading">
        <p class="eyebrow">HELLO!</p>
        <h1>Welcome to Starcourt</h1>
      </div>

      <form class="login-form" method="POST" action="{{ url_for('loginPage') }}">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          ><a href="{{ url_for('forgotPassword') }}" class="forgot-password">Forgot Password?</a>
        </div>

        <div class="form-actions">
          <!-- Replace # with your create-user URL later -->
          <a href="{{ url_for('createUser') }}" class="secondary-button">Create User</a>

          <!-- Connect this form to your Flask login route later -->
          <button type="submit" class="primary-button">Login</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span>★ Starcourt</span>
    <span>Fresh choices, simply delivered.</span>
  </footer>
</body>
</html>
